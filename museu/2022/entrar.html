<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Testers | L.S.P. UT (2022)</title>
<link rel="icon" href="image/tester.ico">
<link rel="stylesheet" href="font-awesome/css/all.css">
<style>
  /* Museu: tela de entrada no estilo do painel de 2022 (fundo #010f0f, dourado #c8a900, borda #a2570f) */
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#010f0f radial-gradient(circle at 50% 30%,#0c2a2a,#010f0f 70%);font-family:"Segoe UI",Arial,sans-serif;color:#ddd;padding:16px;box-sizing:border-box}
  .caixa{width:100%;max-width:400px;background:#010f0f;border:2px solid #a2570f;border-radius:20px;padding:26px;box-shadow:0 0 0 1px #a2570f,0 0 40px rgba(162,87,15,.35);text-align:center}
  h1{margin:0 0 4px;color:#c8a900;font-family:cursive;font-size:24px}
  p{margin:0 0 18px;font-size:13px;color:#999}
  label{display:block;text-align:left;font-size:12px;color:#c8a900;margin-bottom:6px;letter-spacing:.05em}
  select{width:100%;padding:10px;border-radius:10px;border:1px solid #a2570f;background:#031416;color:#fff;font-size:15px}
  button{margin-top:16px;width:100%;padding:11px;border:0;border-radius:20px;background:darkred;color:#fff;font-size:15px;cursor:pointer}
  button:hover{filter:brightness(1.15)}
  #login-error-msg{visibility:hidden;color:#e66;font-size:13px;margin-top:10px}
  .nota{margin-top:18px;font-size:11.5px;color:#777;line-height:1.5}
  a{color:#c8a900}
</style>
</head>
<body>
<div class="caixa">
  <h1><i class="fa fa-flask"></i> Login - Testers</h1>
  <p>Painel do Tester da L.S.P. UT, como era em março de 2022.</p>
  <form id="login-form" onsubmit="return false">
    <label for="username">Entrar como</label>
    <select id="username" name="username">
      <option value="Porito">Porito (Lucas) · Dev</option>
      <option value="Gece">' gece ✪ (Gabriel) · Mod</option>
      <option value="Kawai Foxy">Kawai Foxy (Raguem) · Supp</option>
      <option value="Mono">Mono (Matheus) · Supp</option>
      <option value="Fehtheworld">Fehtheworld (Fernanda) · Designer</option>
      <option value="Krap">Krap ♛ (Gustavo) · Supp Ini.</option>
      <option value="Trick">Trick (Vitor) · Supp Ini.</option>
      <option value="Buddha">Buddha (Guilherme) · Tester</option>
      <option value="JasonMiler">JasonMiler (Leandro) · Tester</option>
    </select>
    <input type="hidden" name="password" value="museu">
    <button type="submit" id="login-form-submit"><i class="fa fa-right-to-bracket"></i> Entrar</button>
    <div id="login-error-msg">Usuario Invalido e/ou Senha</div>
  </form>
  <div class="nota">Peça de museu: as senhas originais foram removidas. Depois de entrar você passa pela tela "Validando...", como no painel original.<br><a href="../index.html">← Voltar ao Museu</a></div>
</div>
<script src="login-page.js"></script>
</body>
</html>
