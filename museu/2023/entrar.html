<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel - Login | L.S.P. UT (2023)</title>
<link rel="icon" href="../../image/tester.ico">
<link rel="stylesheet" href="../../css/bootstrap-admin.css">
<style>
  /* Museu: entrada no estilo do painel de 2023 */
  body{background:#101010;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:16px;box-sizing:border-box}
  #login-box{width:100%;max-width:340px;padding:30px;background:#222;border-radius:12px;color:#ddd;box-shadow:0 0 20px #000}
  #login-box h3{text-align:center;margin:0 0 6px}
  #login-box p{text-align:center;color:#999;font-size:13px;margin:0 0 18px}
  #login-box select{margin-bottom:12px}
  #login-error-msg{color:#d9534f;text-align:center;opacity:0;margin-top:10px}
  .nota{margin-top:16px;font-size:11.5px;color:#888;text-align:center;line-height:1.5}
  .nota a{color:#d3a239}
</style>
</head>
<body>
<div id="login-box">
  <h3>Painel PoroMaster</h3>
  <p>Como era em janeiro de 2023.</p>
  <form id="login-form" onsubmit="return false">
    <label for="username">Entrar como</label>
    <select class="form-control" id="username" name="username">
      <option value="Luckey">Luckey (Lucas) · Dev</option>
      <option value="jake">jake (Pedro) · Mod</option>
      <option value="imnotchinna">imnotchinna (Gustavo) · Mod</option>
      <option value="Khyago">Khyago (Adne) · Tester</option>
      <option value="taikunxx3">taikunxx3 (Victor) · Tester · TAIKUNDROME</option>
    </select>
    <input type="hidden" name="password" value="museu">
    <button type="submit" id="login-form-submit" class="btn btn-primary btn-block">Entrar</button>
    <div id="login-error-msg">Usuário ou senha inválidos</div>
  </form>
  <div class="nota">Peça de museu: as senhas originais foram removidas.<br><a href="../index.html">← Voltar ao Museu</a></div>
</div>
<script src="fantome-fantom.js"></script>
</body>
</html>
